# =============================================================================
# Stash config — TEMPLATE (secrets stripped)
# =============================================================================
# Copy to config.yml and fill in real values before use.
# Real config.yml is gitignored — never commit secrets.
#
# Secrets to replace:
#   jwt_secret_key      — generate with: openssl rand -hex 32
#   session_store_key   — generate with: openssl rand -hex 32
#   stash_boxes[].apikey — your stashdb.org API key (https://stashdb.org)
# =============================================================================

cache: D:\Stash\cache
calculate_md5: false
config: ""
