ui:
    advancedMode: true
    defaultFilters:
        galleries:
            find_filter:
                direction: DESC
                page: "1"
                per_page: "40"
                q: ""
                sort: created_at
            mode: GALLERIES
            object_filter: {}
            ui_options:
                display_mode: "0"
                zoom_index: "1"
        performers:
            find_filter:
                direction: DESC
                page: "1"
                per_page: "40"
                q: ""
                sort: scenes_count
            mode: PERFORMERS
            object_filter:
                gender:
                    modifier: INCLUDES
                    value:
                        - Female
            ui_options:
                display_mode: "0"
                zoom_index: "1"
        scene_markers:
            find_filter:
                direction: DESC
                page: "1"
                per_page: "40"
                q: ""
                sort: created_at
            mode: SCENE_MARKERS
            object_filter: {}
            ui_options:
                display_mode: "2"
                zoom_index: "1"
        scenes:
            find_filter:
                direction: DESC
                page: "1"
                per_page: "40"
                q: ""
                sort: created_at
            mode: SCENES
            object_filter: {}
            ui_options:
                display_mode: "0"
                zoom_index: "1"
        studios:
            find_filter:
                direction: DESC
                page: "1"
                per_page: "40"
                q: ""
                sort: scenes_count
            mode: STUDIOS
            object_filter: {}
            ui_options:
                display_mode: "0"
                zoom_index: "1"
        tags:
            find_filter:
                direction: ASC
                page: "1"
                per_page: "40"
                q: ""
                sort: name
            mode: TAGS
            object_filter:
                favorite:
                    modifier: EQUALS
                    value: "true"
            ui_options:
                display_mode: "0"
                zoom_index: "1"
    enableChromecast: true
    enablePerformerBackgroundImage: true
    enableTagBackgroundImage: true
    frontPageContent:
        - __typename: CustomFilter
          direction: DESC
          message:
            id: recently_released_objects
            values:
                objects: Scenes
          mode: SCENES
          sortBy: date
        - __typename: CustomFilter
          direction: DESC
          message:
            id: recently_added_objects
            values:
                objects: Studios
          mode: STUDIOS
          sortBy: created_at
        - __typename: CustomFilter
          direction: DESC
          message:
            id: recently_released_objects
            values:
